<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welkom</title>
    <link rel="stylesheet" href="/static/style_login.css">
</head>
<body>

    <div class="wrapper">
        <div class="login_box">
            <div class="login-kladheader" style="text-align: center;color: #004df5;">
                <span>Login</span>
            </div>
            <div class="input_box">
                <label for="user" class="label">E-mailadres</label>
                <input type="text" id="user" name="email" class="input_field">
            </div>
            <div class="input_box">
                <label for="pass" class="label">Wachtwoord</label>
                <input type="password" id="pass" name="password" class="input_field">
            </div>
            <div class="input_box">
                <input type="submit" class="input_submit" value="Inloggen" id="loginbtn">
            </div>
        </div>
    </div>

    <script src="/static/login.js"></script>
</body>
</html>
